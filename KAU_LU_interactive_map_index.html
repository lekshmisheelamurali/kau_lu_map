const colorPalette = [
  '#1b9e77','#d95f02','#7570b3','#e7298a','#66a61e','#e6ab02','#a6761d','#666666',
  '#1f78b4','#33a02c','#fb9a99','#fdbf6f','#cab2d6','#6a3d9a','#b15928','#8dd3c7',
  '#ffffb3','#bebada','#fb8072','#80b1d3','#fdb462','#b3de69','#fccde5','#bc80bd',
  '#ccebc5','#ffed6f','#a6cee3','#ff7f00','#cab2d6','#b2df8a'
];

const landuseTypes = [...new Set(KAU_DATA.features.map(f => f.properties.Landuse))].sort();
const colorMap = {};
landuseTypes.forEach((lu, i) => colorMap[lu] = colorPalette[i % colorPalette.length]);

const map = L.map('map', { zoomControl: true });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 20
}).addTo(map);

let selectedLayer = null;

function styleFeature(feature) {
  return {
    fillColor: colorMap[feature.properties.Landuse] || '#999999',
    weight: 1.5,
    opacity: 1,
    color: '#333333',
    fillOpacity: 0.55
  };
}

function highlightFeature(layer) {
  if (selectedLayer) {
    geoLayer.resetStyle(selectedLayer);
  }
  layer.setStyle({ weight: 3, color: '#ff0000', fillOpacity: 0.75 });
  layer.bringToFront();
  selectedLayer = layer;
}

function showInfo(props) {
  const content = `
    <div><b>ID:</b> ${props.ID}</div>
    <div><b>Land Use:</b> ${props.Landuse ?? 'N/A'}</div>
    <div><b>Area:</b> ${props.Area_ha ? props.Area_ha.toFixed(2) + ' ha' : 'N/A'}</div>
    ${props.Remarks ? '<div><b>Remarks:</b> ' + props.Remarks + '</div>' : ''}
  `;
  document.getElementById('infoContent').innerHTML = content;
}

function onEachFeature(feature, layer) {
  layer.on({
    mouseover: function(e) {
      if (selectedLayer !== e.target) {
        e.target.setStyle({ weight: 2.5, color: '#000000', fillOpacity: 0.7 });
      }
    },
    mouseout: function(e) {
      if (selectedLayer !== e.target) {
        geoLayer.resetStyle(e.target);
      }
    },
    click: function(e) {
      highlightFeature(e.target);
      showInfo(feature.properties);
      L.popup()
        .setLatLng(e.latlng)
        .setContent(`<b>ID: ${feature.properties.ID}</b><br>${feature.properties.Landuse ?? ''}`)
        .openOn(map);
    }
  });
}

const geoLayer = L.geoJSON(KAU_DATA, {
  style: styleFeature,
  onEachFeature: onEachFeature
}).addTo(map);

map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });

const legendDiv = document.getElementById('legend');
let legendHtml = '<h4>Land Use Types</h4>';
landuseTypes.forEach(lu => {
  legendHtml += `<div class="legend-item"><div class="legend-swatch" style="background:${colorMap[lu]}"></div>${lu}</div>`;
});
legendDiv.innerHTML = legendHtml;
</script>
